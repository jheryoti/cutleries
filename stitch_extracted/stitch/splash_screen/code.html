                </span>
</div>

<div class="mt-12 flex flex-col items-center gap-4">

<div class="w-3 h-3 bg-primary rounded-full shadow-[0_0_15px_rgba(118,214,213,0.6)] animate-pulse"></div>
</div>
<p class="font-label text-on-secondary-container text-[10px] tracking-widest uppercase opacity-60">
                    Preparing your menu
                </p>
</div>
